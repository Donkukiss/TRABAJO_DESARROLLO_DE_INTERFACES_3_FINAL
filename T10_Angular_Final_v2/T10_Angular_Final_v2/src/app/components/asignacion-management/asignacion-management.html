<div class="management-grid">
  <div class="card form-card">
    <h3>Asignar Curso a Docente</h3>
    <p class="alert-error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <form [formGroup]="asignacionForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Docente</label>
        <select formControlName="idDocente">
          <option [ngValue]="null" disabled>Seleccione un docente</option>
          <option *ngFor="let d of docentes" [ngValue]="d.idDocente">{{ d.usuario.nombre }} {{ d.usuario.apellido }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Curso</label>
        <select formControlName="idCurso">
          <option [ngValue]="null" disabled>Seleccione un curso</option>
          <option *ngFor="let c of cursos" [ngValue]="c.idCurso">{{ c.nombre }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Estado</label>
        <select formControlName="estado">
          <option [ngValue]="true">Activo</option>
          <option [ngValue]="false">Inactivo</option>
        </select>
      </div>

      <div class="actions">
        <button type="submit" [disabled]="asignacionForm.invalid" class="btn-primary">Asignar</button>
        <button type="button" class="btn-cancel" (click)="resetForm()">Cancelar</button>
      </div>
    </form>
  </div>

  <div class="card table-card">
    <h3>Asignaciones Registradas</h3>
    <table>
      <thead>
        <tr>
          <th>Docente</th>
          <th>Curso</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let a of asignaciones">
          <td>{{ a.docente?.usuario?.nombre }} {{ a.docente?.usuario?.apellido }}</td>
          <td>{{ a.curso?.nombre }}</td>
          <td>
            <span class="badge" [class.badge-active]="a.estado" [class.badge-inactive]="!a.estado">
              {{ a.estado ? 'ACTIVO' : 'INACTIVO' }}
            </span>
          </td>
          <td>
            <button class="btn-delete" (click)="onDelete(a.idAsignacion!)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
