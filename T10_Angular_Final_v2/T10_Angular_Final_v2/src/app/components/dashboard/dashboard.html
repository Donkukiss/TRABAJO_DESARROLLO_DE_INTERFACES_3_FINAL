<div class="dashboard-layout">
  <aside class="sidebar">
    <div class="brand">Institución Educativa</div>

    <div class="user-info" *ngIf="currentUser">
      <span class="user-name">{{ currentUser.nombres }} {{ currentUser.apellidos }}</span>
      <span class="user-role">{{ currentUser.rol | rolLabel }}</span>
    </div>

    <nav class="nav-links">
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>

      <a *appHasRole="['ADMIN']" routerLink="/dashboard/usuarios" routerLinkActive="active">Usuarios</a>

      <a routerLink="/dashboard/cursos" routerLinkActive="active">Cursos</a>

      <a *appHasRole="['ADMIN']" routerLink="/dashboard/secciones" routerLinkActive="active">Secciones</a>

      <a *appHasRole="['ADMIN']" routerLink="/dashboard/asignaciones" routerLinkActive="active">Asignaciones</a>

      <a *appHasRole="['ADMIN']" routerLink="/dashboard/matriculas" routerLinkActive="active">Matrículas</a>

      <a *appHasRole="['ADMIN', 'PROFESOR']" routerLink="/dashboard/notas" routerLinkActive="active">Notas</a>

      <a *appHasRole="['ESTUDIANTE']" routerLink="/dashboard/mis-notas" routerLinkActive="active">Mis Notas</a>
    </nav>

    <button class="logout-btn" (click)="logout()">Cerrar Sesión</button>
  </aside>

  <div class="content-area">
    <router-outlet></router-outlet>
  </div>
</div>
